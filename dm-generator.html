const $ = id => document.getElementById(id);
let bag = [];
let lastIdx = -1;

function nextIndex(){
  if(bag.length === 0){
    bag = templates.map((_, i) => i);
    for(let i = bag.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    // avoid same message twice in a row when the bag refills
    if(bag[bag.length - 1] === lastIdx && bag.length > 1){
      [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
    }
  }
  lastIdx = bag.pop();
  return lastIdx;
}

function inr(n){ return Number(n).toLocaleString("en-IN"); }

function build(){
  let u = $("user").value.trim().replace(/^@+/, "").replace(/\s+/g, "");
  const price = parseFloat($("price").value);
  if(!u || !price || price <= 0){ $("err").style.display = "block"; return; }
  $("err").style.display = "none";

  const idx = nextIndex();
  const msg = templates[idx]
    .replace(/\{u\}/g, u)
    .replace(/\{me\}/g, NAME)
    .replace(/\{p2\}/g, inr(price * 2))
    .replace(/\{p3\}/g, inr(price * 3))
    .replace(/\{p4\}/g, inr(price * 4))
    .replace(/\{p5\}/g, inr(price * 5))
    .replace(/\{p\}/g, inr(price));

  $("out").textContent = msg;
  $("copy").textContent = "Copy Message 📋";
  $("copy").classList.remove("done");
  $("count").textContent = "Message " + (templates.length - bag.length) + " of " + templates.length + " (repeat nahi thase jya sudhi badha pura na thay)";
}

async function copyText(){
  const text = $("out").textContent;
  if(!text || text.startsWith("Tamaro message")) return;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  $("copy").textContent = "Copied ✅";
  $("copy").classList.add("done");
}

$("gen").addEventListener("click", build);
$("copy").addEventListener("click", copyText);
