<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 400px;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .timer {
            font-size: 56px;
            font-weight: bold;
            color: #10b981;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.05);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="spinner"></div>
        <h2>Loading Target Link...</h2>
        <p>Tmari main link background ma load thai rahi chhe.</p>
        <div class="timer" id="countdown">10</div>
        <p>seconds ma automatic redirect thai jase.</p>
    </div>

    <script>
        // 10 second no timer
        let timeLeft = 10;
        const timerElement = document.getElementById('countdown');
        
        // Tmari main YouTube link
        const targetUrl = "https://www.youtube.com/@tmkocmoviesofficial";

        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            // Timer 0 thai jay etle redirect kare
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                timerElement.textContent = "0";
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
