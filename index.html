<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comment Animation Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d14;--pn:#17151f;--ln:#2c2938;--tx:#f3f1fa;--mu:#9b97ad;--a:#7c3aed;--b:#ec4899}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;padding:16px 16px 40px;background:var(--bg);color:var(--tx);font:500 15px/1.45 Poppins,'Segoe UI',system-ui,sans-serif}
h1{font-size:23px;font-weight:800;margin:6px 0 2px;letter-spacing:-.4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.stage{display:flex;justify-content:center;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:repeating-conic-gradient(#2b2837 0 25%,#1d1b27 0 50%) 0 0/22px 22px}
canvas{display:block;max-width:100%;max-height:58vh;width:auto;height:auto}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:4px 14px 16px;margin-top:14px}
label{display:block;color:var(--mu);font-size:12.5px;margin:14px 0 6px}
input[type=text],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:#0e0d14;color:var(--tx);font:inherit}
input[type=file]{width:100%;color:var(--mu);font:inherit;font-size:13px}
input[type=file]::file-selector-button{background:var(--a);color:#fff;border:0;border-radius:9px;padding:9px 14px;margin-right:10px;font:inherit;font-size:13px}
input[type=range]{width:100%;accent-color:var(--b)}
.row{display:flex;gap:10px}.row>*{flex:1}
input[type=color]{width:100%;height:42px;border:1px solid var(--ln);border-radius:10px;background:#0e0d14;padding:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--ln);background:#0e0d14;color:var(--tx);font:inherit;font-size:13.5px;cursor:pointer}
.chip i{width:16px;height:16px;border-radius:50%;border:1px solid #ffffff44}
.chip.on{border-color:var(--b);background:#2a1a2e}
.chk{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--tx);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--b)}
#dl{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;font:800 16px Poppins,system-ui,sans-serif;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;position:relative;overflow:hidden}
#dl span{position:relative}
#bar{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff33}
.hint{color:var(--mu);font-size:12px;margin:10px 0 0}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<h1>Comment Animation Maker</h1>
<p class="sub">Add your app logo and keyword, preview live, then download the video.</p>

<div class="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>

<div class="panel">
  <label for="lg">App logo (PNG)</label>
  <input type="file" id="lg" accept="image/*">
  <label for="t1">Top text</label>
  <input type="text" id="t1" value="Comment">
  <label for="kw">Keyword</label>
  <input type="text" id="kw" value="Moviebox">
  <label for="st">Text animation</label>
  <select id="st">
    <option value="pop">Pop (bouncy letters)</option>
    <option value="slide">Slide up</option>
    <option value="type">Typewriter</option>
    <option value="wave">Wave</option>
  </select>
  <label>Colors: accent 1, accent 2, text</label>
  <div class="row"><input type="color" id="c1" value="#7c3aed"><input type="color" id="c2" value="#ec4899"><input type="color" id="c3" value="#ffffff"></div>
  <label>Background</label>
  <div class="chips" id="chips">
    <button class="chip" data-k="clear"><i style="background:repeating-conic-gradient(#888 0 25%,#ddd 0 50%) 0 0/8px 8px"></i>Transparent</button>
    <button class="chip" data-k="green"><i style="background:#00b140"></i>Green</button>
    <button class="chip on" data-k="black"><i style="background:#000"></i>Black</button>
    <button class="chip" data-k="blue"><i style="background:#0a3cff"></i>Blue</button>
  </div>
  <label for="ar">Video size</label>
  <select id="ar">
    <option value="1080x1920">Reel 9:16 (1080×1920)</option>
    <option value="1080x1080">Square 1:1 (1080×1080)</option>
    <option value="1920x1080">Landscape 16:9 (1920×1080)</option>
  </select>
  <label for="fm">Format</label>
  <select id="fm">
    <option value="mp4">MP4 (if browser supports)</option>
    <option value="webm">WebM</option>
  </select>
  <label class="chk"><input type="checkbox" id="rd"> Round the logo corners</label>
  <label for="du">Video length: <b id="dv">6</b> seconds</label>
  <input type="range" id="du" min="3" max="30" value="6">
  <button id="dl"><div id="bar"></div><span id="dt">Download video</span></button>
  <p class="hint">Transparent saves as WebM and works best in Chrome on a computer. In a phone editor, pick Green and use chroma key. The video is recorded in real time, so keep this tab open until it finishes.</p>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const BG={clear:null,green:'#00b140',black:'#000000',blue:'#0a3cff'};
let bg='black',mode='idle',st=performance.now(),img;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),
  pr=(t,s,d)=>clamp((t-s)/d),
  back=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
  cub=x=>1-Math.pow(1-x,3),
  FF="Poppins,'Segoe UI',system-ui,sans-serif";
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function placeholder(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,512,512);
  gr.addColorStop(0,'#7c3aed');gr.addColorStop(1,'#ec4899');g.fillStyle=gr;rr(g,0,0,512,512,110);g.fill();
  g.fillStyle='#fff';g.beginPath();g.moveTo(200,150);g.lineTo(200,362);g.lineTo(372,256);g.closePath();g.fill();return c}
img=placeholder();
document.fonts&&document.fonts.load('800 40px Poppins');

const oc=document.createElement('canvas');oc.width=oc.height=512;const og=oc.getContext('2d');
const hs=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},
  eo=x=>1-Math.pow(1-x,4),
  el=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2.0944)+1;
function star(x,y,r,a){ctx.beginPath();for(let i=0;i<8;i++){const q=i%2?r*.3:r,z=a+i*Math.PI/4;ctx.lineTo(x+Math.cos(z)*q,y+Math.sin(z)*q)}ctx.closePath();ctx.fill()}
function burst(t,t0,cx,cy,u,n,cols){
  const s=t-t0;if(s<0||s>1.7)return;const k=s/1.7;
  for(let i=0;i<n;i++){
    const an=hs(i+t0*9)*6.283,sp=u*(.3+hs(i*3+1)*.7),d=eo(clamp(s/1.1)),
      x=cx+Math.cos(an)*sp*d,y=cy+Math.sin(an)*sp*d+u*.12*s*s,r=u*(.008+hs(i*5+2)*.014)*(1-k*.6);
    ctx.globalAlpha=1-k;ctx.fillStyle=cols[i%cols.length];
    if(i%3===0)star(x,y,r*2.4,s*4+i);else{ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
  }
  ctx.globalAlpha=1}
function twinkle(t,cx,cy,R,u,col){
  const f=clamp((t-1.2)/.6);if(f<=0)return;
  for(let i=0;i<10;i++){
    const an=hs(i)*6.283+t*.15*(i%2?1:-1),rad=R*(.62+hs(i+9)*.35),ph=(t*.7+hs(i+4))%1,sc=Math.sin(ph*Math.PI);
    ctx.globalAlpha=sc*.9*f;ctx.fillStyle=col;star(cx+Math.cos(an)*rad,cy+Math.sin(an)*rad,u*(.012+hs(i+7)*.014)*sc,t)}
  ctx.globalAlpha=1}

function chars(s,cx,cy,fs,t,t0,style,col){
  ctx.font='800 '+fs+'px '+FF;ctx.textBaseline='middle';ctx.textAlign='left';
  const a=[...s],ws=a.map(c=>ctx.measureText(c).width),tot=ws.reduce((p,q)=>p+q,0),stag=style==='type'?.09:.055;
  let x=cx-tot/2,last=x;
  a.forEach((c,i)=>{
    const lt=t-t0-i*stag,k=clamp(lt/.6);let sc=1,al=1,oy=0,ro=0;
    if(style==='slide'){const e=1-eo(k);oy=e*fs*1.1;al=clamp(k*3);ro=e*.3}
    else if(style==='type'){al=lt>=0?1:0;sc=lt>=0?1+.35*Math.exp(-lt*12):1}
    else{sc=back(k);al=clamp(k*4);ro=(1-k)*-.45;oy=(1-k)*fs*.4}
    if(style==='wave'&&k>=1){oy=Math.sin(t*4+i*.7)*fs*.09;ro=Math.sin(t*4+i*.7)*.05}
    if(al>0){ctx.save();ctx.globalAlpha=al;ctx.fillStyle=col;ctx.translate(x+ws[i]/2,cy+oy);ctx.rotate(ro);ctx.scale(sc,sc);ctx.fillText(c,-ws[i]/2,0);ctx.restore();last=x+ws[i]}
    x+=ws[i]});
  if(style==='type'&&t>t0&&Math.floor(t*2)%2===0){ctx.fillStyle=col;ctx.fillRect(last+fs*.05,cy-fs*.4,fs*.06,fs*.8)}
}

function draw(t){
  const W=cv.width,H=cv.height,L=W>H,u=Math.min(W,H),A=$('c1').value,B=$('c2').value,TC=$('c3').value,S=$('st').value,rd=$('rd').checked;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.clearRect(0,0,W,H);
  if(BG[bg]){ctx.fillStyle=BG[bg];ctx.fillRect(0,0,W,H)}
  const lx=L?W*.27:W/2,ly=L?H/2:H*.36,tx=L?W*.67:W/2,ty=L?H/2:H*.67,ls=u*(L?.5:.36),mw=L?W*.5:W*.86;
  // soft aura (only on black / blue so green and transparent stay clean)
  if(bg==='black'||bg==='blue'){const R=u*(.75+.04*Math.sin(t*2)),g=ctx.createRadialGradient(lx,ly,0,lx,ly,R);
    g.addColorStop(0,A+'77');g.addColorStop(1,A+'00');ctx.globalAlpha=clamp(t/.8);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  // slow camera push-in
  const z=1+.05*(1-Math.exp(-t/3));ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  // pulse rings
  for(let j=0;j<2;j++){const s=t-1.1-j*.8;if(s>0){const k=(s/1.6)%1,r=ls*(1+k*.6);
    ctx.globalAlpha=(1-k)*.7;ctx.strokeStyle=A;ctx.lineWidth=u*.008;rr(ctx,lx-r/2,ly-r/2,r,r,r*.22);ctx.stroke();ctx.globalAlpha=1}}
  // logo: drops in, spins, lands with an elastic bounce, then shines
  const kd=pr(t,.1,.9),fy=Math.sin(t*2)*ls*.02;
  og.clearRect(0,0,512,512);og.save();if(rd){rr(og,0,0,512,512,112);og.clip()}
  const iw=img.width,ih=img.height,k=(rd?Math.max:Math.min)(512/iw,512/ih);
  og.drawImage(img,256-iw*k/2,256-ih*k/2,iw*k,ih*k);og.restore();
  const sh=((t-1.5)/3)%1;
  if(t>1.5&&sh<.3){const x=-150+sh/.3*800,g=og.createLinearGradient(x-80,0,x+80,80);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
    og.globalCompositeOperation='source-atop';og.fillStyle=g;og.fillRect(0,0,512,512);og.globalCompositeOperation='source-over'}
  ctx.save();ctx.translate(lx,ly+fy-(1-eo(kd))*u*.5);ctx.rotate((1-eo(kd))*-.7);const ps=el(kd);ctx.scale(ps,ps);
  ctx.globalAlpha=clamp(kd*4);ctx.drawImage(oc,-ls/2,-ls/2,ls,ls);ctx.restore();ctx.globalAlpha=1;
  burst(t,.55,lx,ly,u,22,[A,B,'#ffffff']);twinkle(t,lx,ly,ls,u,'#ffffff');
  // text block
  const kw='\u201C'+($('kw').value||' ')+'\u201D';let kf=u*.13;
  ctx.font='800 '+kf+'px '+FF;const m0=ctx.measureText(kw).width;kf=Math.min(kf,kf*(mw*.9)/(m0+kf*.9));
  ctx.font='800 '+kf+'px '+FF;const pw=ctx.measureText(kw).width+kf*.9,ph=kf*1.5,f1=kf*.75,gap=u*.02,tot=f1+ph+gap;
  chars($('t1').value,tx,ty-tot/2+f1/2,f1,t,.8,'slide',TC);
  const y2=ty+tot/2-ph/2,pk=el(pr(t,1.1,.8))*(1+.015*Math.sin(t*3));
  if(pk>.01){ctx.save();ctx.translate(tx,y2);ctx.scale(pk,pk);const gr=ctx.createLinearGradient(-pw/2,0,pw/2,0);gr.addColorStop(0,A);gr.addColorStop(1,B);
    ctx.fillStyle=gr;ctx.shadowColor=B;ctx.shadowBlur=u*(.035+.015*Math.sin(t*3));rr(ctx,-pw/2,-ph/2,pw,ph,ph/2);ctx.fill();
    ctx.shadowBlur=0;ctx.clip();const q=((t-2)/2.6)%1;
    if(t>2&&q<.4){const x=-pw/2-ph+q/.4*(pw+ph*2),g=ctx.createLinearGradient(x-ph*.6,-ph/2,x+ph*.6,ph/2);
      g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(-pw/2,-ph/2,pw,ph)}
    ctx.restore()}
  burst(t,1.1,tx,y2,u*.8,26,[B,A,'#ffffff']);
  chars(kw,tx,y2,kf,t,1.4,S,TC);
  ctx.restore();
}

function loop(now){if(mode==='idle')draw(((now-st)/1000)%(+$('du').value+.8));requestAnimationFrame(loop)}
requestAnimationFrame(loop);

$('lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{img=im;st=performance.now()};im.src=URL.createObjectURL(f)};
$('ar').onchange=()=>{const[w,h]=$('ar').value.split('x');cv.width=+w;cv.height=+h};
$('du').oninput=()=>{$('dv').textContent=$('du').value};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{bg=b.dataset.k;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));st=performance.now()});
['t1','kw','st'].forEach(i=>$(i).addEventListener('input',()=>{st=performance.now()}));

$('dl').onclick=()=>{
  if(mode!=='idle')return;
  if(!window.MediaRecorder){alert('Recording is not supported here. Please open this file in the latest Chrome.');return}
  const d=+$('du').value,tr=bg==='clear',
    opts=tr?['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm']:
      $('fm').value==='mp4'?['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm']:['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'],
    mime=opts.find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){alert('No video format is supported in this browser. Please use the latest Chrome.');return}
  mode='rec';const rc=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:12e6}),ch=[],bar=$('bar'),dt=$('dt');
  rc.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  rc.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mime}));
    a.download=(($('kw').value||'').replace(/[^\w]+/g,'_')||'animation')+'.'+(mime.includes('mp4')?'mp4':'webm');
    document.body.appendChild(a);a.click();a.remove();bar.style.width='0';dt.textContent='Download video';mode='idle';st=performance.now()};
  rc.start();const t0=performance.now();
  (function f(){const t=(performance.now()-t0)/1000;draw(Math.min(t,d));bar.style.width=Math.min(100,t/d*100)+'%';dt.textContent='Recording… '+Math.min(100,Math.round(t/d*100))+'%';
    if(t<d)requestAnimationFrame(f);else setTimeout(()=>rc.stop(),200)})();
};
</script>
</body>
  </html>
