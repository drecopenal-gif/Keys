<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Locker - Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(255, 0, 128, 0.15), transparent 25%);
        }

        .glass-container {
            background: rgba(25, 25, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff007b, #6b21a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #a1a1aa;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff007b;
            box-shadow: 0 0 10px rgba(255, 0, 123, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #ff007b, #6b21a8);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 0, 123, 0.3);
        }

        .btn:disabled {
            background: #2a2a35;
            color: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-sub {
            background: #ff0000;
        }
        
        .btn-sub:hover {
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            display: none;
            word-break: break-all;
            font-size: 0.85rem;
            color: #4ade80;
            text-align: center;
        }

        #timer {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            color: #ff007b;
            display: none;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #ff0000;
        }

        .step-icon {
            font-size: 1.5rem;
        }
        
        .step-text h4 {
            margin-bottom: 3px;
        }
        
        .step-text p {
            font-size: 0.8rem;
            color: #a1a1aa;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ADMIN PANEL -->
    <div class="glass-container" id="adminPanel">
        <h2><i class="ri-settings-4-line"></i> Link Generator</h2>
        
        <div class="input-group">
            <label>YouTube Channel URL</label>
            <input type="text" id="ytLink" placeholder="https://youtube.com/@linkbeby69">
        </div>

        <div class="input-group">
            <label>Destination Video URL</label>
            <input type="text" id="destLink" placeholder="https://youtube.com/watch?v=...">
        </div>

        <button class="btn" onclick="generateLink()">
            <i class="ri-link-m"></i> Generate Locked Link
        </button>

        <div class="result-box" id="resultBox"></div>
        <button class="btn" id="copyBtn" style="margin-top:10px; display:none; background:#3f3f46;" onclick="copyLink()">
            <i class="ri-file-copy-line"></i> Copy Link
        </button>
    </div>


    <!-- USER UNLOCK PAGE -->
    <div class="glass-container hidden" id="userPanel">
        <h2><i class="ri-lock-unlock-line"></i> Unlock Link</h2>
        
        <div class="step">
            <div class="step-icon" style="color:#ff0000;"><i class="ri-youtube-fill"></i></div>
            <div class="step-text">
                <h4>Step 1: Subscribe</h4>
                <p>Subscribe to our channel to continue</p>
            </div>
        </div>

        <button class="btn btn-sub" id="subBtn" onclick="startUnlockProcess()">
            <i class="ri-youtube-line"></i> Subscribe Channel
        </button>

        <div id="timer">10</div>

        <button class="btn" id="unlockBtn" disabled style="margin-top: 20px;">
            <i class="ri-lock-2-line"></i> Get Link
        </button>
    </div>


    <script>
        // Check URL for encoded data
        const urlParams = new URLSearchParams(window.location.search);
        const lockedData = urlParams.get('data');

        let targetDestLink = "";

        if (lockedData) {
            // User View
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('userPanel').classList.remove('hidden');
            
            try {
                const decoded = JSON.parse(atob(lockedData));
                const ytChannel = decoded.y;
                targetDestLink = decoded.d;

                document.getElementById('subBtn').onclick = function() {
                    window.open(ytChannel, '_blank');
                    startTimer();
                };
            } catch (e) {
                alert("Invalid Link!");
            }
        }

        // Admin Link Generator function
        function generateLink() {
            let yt = document.getElementById('ytLink').value.trim();
            let dest = document.getElementById('destLink').value.trim();

            if(!yt || !dest) {
                alert("Banne links nakhvi jaruri chhe!");
                return;
            }

            // Append sub_confirmation if not present
            if (!yt.includes('sub_confirmation=1')) {
                yt += (yt.includes('?') ? '&' : '?') + 'sub_confirmation=1';
            }

            const dataObj = { y: yt, d: dest };
            const encoded = btoa(JSON.stringify(dataObj));
            
            const currentUrl = window.location.href.split('?')[0];
            const finalLink = `${currentUrl}?data=${encoded}`;

            const resBox = document.getElementById('resultBox');
            resBox.innerHTML = finalLink;
            resBox.style.display = 'block';
            document.getElementById('copyBtn').style.display = 'flex';
            
            window.generatedLinkUrl = finalLink;
            
            // Haptic Feedback if available
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function copyLink() {
            navigator.clipboard.writeText(window.generatedLinkUrl);
            document.getElementById('copyBtn').innerHTML = '<i class="ri-check-line"></i> Copied!';
            setTimeout(() => {
                document.getElementById('copyBtn').innerHTML = '<i class="ri-file-copy-line"></i> Copy Link';
            }, 2000);
        }

        // Timer Logic for User View
        function startTimer() {
            const subBtn = document.getElementById('subBtn');
            const timerDiv = document.getElementById('timer');
            const unlockBtn = document.getElementById('unlockBtn');
            
            subBtn.style.display = 'none';
            timerDiv.style.display = 'block';
            
            let timeLeft = 10;
            timerDiv.innerText = timeLeft;

            const interval = setInterval(() => {
                timeLeft--;
                timerDiv.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerDiv.style.display = 'none';
                    unlockBtn.disabled = false;
                    unlockBtn.innerHTML = '<i class="ri-download-cloud-2-line"></i> Go to Video';
                    unlockBtn.classList.remove('btn-disabled');
                    unlockBtn.onclick = function() {
                        window.location.href = targetDestLink;
                    };
                    
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
            }, 1000);
        }
    </script>
</body>
</html>
