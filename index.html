<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .song-card:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.02); }
        
        .playing-bars { display: flex; align-items: flex-end; height: 15px; gap: 2px; }
        .bar { width: 3px; background: #10b981; animation: bounce 1s infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.1s; }
        
        @keyframes bounce {
            0% { height: 3px; }
            100% { height: 15px; }
        }

        /* Suggestion Dropdown */
        #suggestionsBox {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 5px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex flex-col">

    <!-- HEADER -->
    <header class="glass-panel p-4 flex items-center justify-between shadow-lg z-50 sticky top-0">
        <h1 class="text-2xl font-bold text-indigo-400 hidden md:block"><i class="fas fa-music mr-2"></i>XRYS Music</h1>
        
        <!-- Search Container -->
        <div class="relative w-full md:w-1/2 max-w-md mx-4">
            <input type="text" id="searchInput" placeholder="Search songs, artists..." autocomplete="off"
                class="w-full bg-[#0f172a] border border-gray-600 rounded-full py-2 px-10 focus:outline-none focus:border-indigo-500 transition text-sm">
            <i class="fas fa-search absolute left-4 top-3 text-gray-400"></i>
            <button onclick="searchSongs()" class="absolute right-2 top-1 bg-indigo-600 hover:bg-indigo-700 px-4 py-1 rounded-full text-sm font-bold transition">Go</button>
            
            <!-- Live Suggestions Dropdown -->
            <div id="suggestionsBox" class="hidden"></div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto p-6 pb-24" id="mainContent">
        <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center">
            <i class="fas fa-headphones text-6xl text-indigo-500 mb-4 opacity-50"></i>
            <h2 class="text-2xl font-bold mb-2">Discover Millions of Songs</h2>
            <p class="text-gray-400 text-sm">Type in the search bar to see suggestions.</p>
        </div>

        <div id="loader" class="hidden flex justify-center mt-10">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
        </div>
        
        <div id="resultsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden"></div>
    </main>

    <!-- BOTTOM PLAYER -->
    <div id="playerBar" class="glass-panel border-t border-gray-700 p-3 md:p-4 flex items-center justify-between fixed bottom-0 w-full shadow-2xl translate-y-full transition-transform duration-300 z-50">
        <div class="flex items-center gap-3 w-1/3">
            <img id="currentImg" src="https://via.placeholder.com/50" class="w-12 h-12 rounded object-cover shadow-md">
            <div class="overflow-hidden">
                <h4 id="currentTitle" class="text-sm font-bold truncate">Song Title</h4>
                <p id="currentArtist" class="text-xs text-gray-400 truncate">Artist Name</p>
            </div>
            <div class="playing-bars ml-2 hidden" id="equalizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <div class="flex flex-col items-center w-1/3">
            <div class="flex items-center gap-4 mb-2">
                <button onclick="prevSong()" class="text-gray-400 hover:text-white transition"><i class="fas fa-backward"></i></button>
                <button onclick="togglePlay()" id="playBtn" class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center hover:scale-105 transition shadow-lg shadow-indigo-500/50">
                    <i class="fas fa-play ml-1" id="playIcon"></i>
                </button>
                <button onclick="nextSong()" class="text-gray-400 hover:text-white transition"><i class="fas fa-forward"></i></button>
            </div>
            
            <div class="flex items-center gap-2 w-full max-w-md text-xs text-gray-400">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500" value="0" min="0" max="100">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="flex justify-end items-center gap-3 w-1/3 pr-4 hidden md:flex">
            <i class="fas fa-volume-up text-gray-400"></i>
            <input type="range" id="volumeBar" class="w-20 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500" value="100" min="0" max="100">
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const API_BASE = "https://saavn.dev/api/search/songs?query=";
        
        let songs = [];
        let currentIndex = -1;
        const audio = document.getElementById('audioPlayer');
        const playerBar = document.getElementById('playerBar');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        
        let debounceTimer;

        // --- 1. LIVE SUGGESTIONS LOGIC ---
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            
            clearTimeout(debounceTimer);
            
            if(query.length < 2) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            // Wait 500ms after user stops typing
            debounceTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 500);
        });

        // Hide suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if(!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        });

        async function fetchSuggestions(query) {
            try {
                const res = await fetch(API_BASE + encodeURIComponent(query) + "&limit=5");
                const data = await res.json();
                
                if(data.data && data.data.results && data.data.results.length > 0) {
                    renderSuggestions(data.data.results);
                } else {
                    suggestionsBox.classList.add('hidden');
                }
            } catch (error) {
                console.error(error);
            }
        }

        function renderSuggestions(results) {
            suggestionsBox.innerHTML = '';
            
            results.forEach(song => {
                const artist = song.artists.primary[0]?.name || 'Unknown';
                const img = song.image && song.image.length > 0 ? song.image[0].url : 'https://via.placeholder.com/40';
                
                const div = document.createElement('div');
                div.className = "suggestion-item";
                div.innerHTML = `
                    <img src="${img}" class="w-10 h-10 rounded object-cover">
                    <div class="overflow-hidden">
                        <p class="text-sm font-bold truncate">${song.name}</p>
                        <p class="text-xs text-gray-400 truncate">${artist}</p>
                    </div>
                `;
                
                // When a suggestion is clicked, fill search bar and trigger main search
                div.onclick = () => {
                    searchInput.value = song.name;
                    suggestionsBox.classList.add('hidden');
                    searchSongs();
                };
                
                suggestionsBox.appendChild(div);
            });
            
            suggestionsBox.classList.remove('hidden');
        }


        // --- 2. MAIN SEARCH & PLAYER LOGIC ---
        async function searchSongs() {
            const query = searchInput.value.trim();
            if(!query) return;

            suggestionsBox.classList.add('hidden'); // Hide suggestions on main search
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('resultsGrid').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');

            try {
                const res = await fetch(API_BASE + encodeURIComponent(query));
                const data = await res.json();
                
                songs = data.data.results;
                renderSongs(songs);
            } catch (error) {
                console.error("Error fetching songs:", error);
                alert("Error fetching songs. Try again.");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function renderSongs(songList) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';
            
            if(songList.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 col-span-full text-center mt-10">No songs found.</p>`;
                grid.classList.remove('hidden');
                return;
            }

            songs = songList.filter(s => s.downloadUrl && s.downloadUrl.length > 0);
            
            songs.forEach((song, index) => {
                const img = song.image[song.image.length - 1].url;
                
                const card = document.createElement('div');
                card.className = "song-card glass-panel p-3 rounded-xl cursor-pointer transition duration-200 flex flex-col gap-2 relative group";
                card.onclick = () => playSong(index);
                
                card.innerHTML = `
                    <div class="relative w-full aspect-square rounded-lg overflow-hidden mb-2">
                        <img src="${img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <i class="fas fa-play-circle text-4xl text-white"></i>
                        </div>
                    </div>
                    <h3 class="text-sm font-bold truncate">${song.name}</h3>
                    <p class="text-xs text-gray-400 truncate">${song.artists.primary[0]?.name || 'Unknown Artist'}</p>
                `;
                grid.appendChild(card);
            });

            grid.classList.remove('hidden');
        }

        function playSong(index) {
            if(index < 0 || index >= songs.length) return;
            
            currentIndex = index;
            const song = songs[index];
            
            const audioUrl = song.downloadUrl[song.downloadUrl.length - 1].url;
            const imgUrl = song.image[song.image.length - 1].url;
            
            audio.src = audioUrl;
            audio.play();
            
            playerBar.classList.remove('translate-y-full');
            document.getElementById('currentTitle').innerText = song.name;
            document.getElementById('currentArtist').innerText = song.artists.primary[0]?.name || 'Unknown';
            document.getElementById('currentImg').src = imgUrl;
            
            document.getElementById('playIcon').className = "fas fa-pause";
            document.getElementById('equalizer').classList.remove('hidden');
        }

        function togglePlay() {
            if(!audio.src) return;
            
            if(audio.paused) {
                audio.play();
                document.getElementById('playIcon').className = "fas fa-pause";
                document.getElementById('equalizer').classList.remove('hidden');
            } else {
                audio.pause();
                document.getElementById('playIcon').className = "fas fa-play ml-1";
                document.getElementById('equalizer').classList.add('hidden');
            }
        }

        function nextSong() {
            if(currentIndex < songs.length - 1) playSong(currentIndex + 1);
        }

        function prevSong() {
            if(currentIndex > 0) playSong(currentIndex - 1);
        }

        audio.addEventListener('timeupdate', () => {
            if(audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressBar').value = progress;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('duration').innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => nextSong());

        document.getElementById('progressBar').addEventListener('input', (e) => {
            if(audio.duration) {
                const seekTime = (e.target.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        document.getElementById('volumeBar').addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchSongs();
        });
    </script>
</body>
</html>
