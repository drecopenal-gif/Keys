<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .progress-ring { transform: rotate(-90deg); }
        .hidden-view { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- ADMIN VIEW -->
    <div id="adminView" class="glass w-full max-w-md p-8 rounded-2xl fade-in relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500 rounded-t-2xl"></div>
        
        <h1 class="text-2xl font-bold mb-2 text-center text-blue-400">Admin Link Generator</h1>
        <p class="text-xs text-gray-400 text-center mb-6">Create a locked link for your users</p>

        <label class="block text-sm text-gray-400 mb-1">YouTube Channel Link:</label>
        <input type="text" id="ytLink" placeholder="https://youtube.com/@YourChannel" class="w-full bg-gray-900 border border-gray-600 p-3 rounded-lg mb-4 text-white focus:outline-none focus:border-blue-500 transition">

        <label class="block text-sm text-gray-400 mb-1">Video Link (Telegram/Drive):</label>
        <input type="text" id="videoLink" placeholder="https://t.me/yourvideo" class="w-full bg-gray-900 border border-gray-600 p-3 rounded-lg mb-6 text-white focus:outline-none focus:border-blue-500 transition">

        <button onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-500/30">
            <i class="fas fa-magic mr-2"></i> Generate & Preview
        </button>
    </div>

    <!-- USER VIEW (PREVIEW & REAL USERS) -->
    <div id="userView" class="hidden-view w-full max-w-md flex-col items-center relative fade-in">
        
        <!-- Top Bar for Admin (Shows only when generating) -->
        <div id="adminBar" class="hidden w-full bg-gray-800 border border-gray-700 rounded-t-xl p-3 flex justify-between items-center mb-2">
            <div class="text-xs text-green-400 truncate mr-2" id="shareLinkText">Generating...</div>
            <div class="flex gap-2">
                <button onclick="copyLink()" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-xs font-bold whitespace-nowrap"><i class="fas fa-copy"></i> Copy</button>
                <button onclick="resetAdmin()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div class="glass w-full p-8 rounded-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 via-purple-500 to-blue-500"></div>

            <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fab fa-youtube text-4xl text-red-500"></i>
            </div>

            <h1 class="text-2xl font-bold mb-2" id="title">Subscribe to Unlock</h1>
            <p class="text-gray-400 text-sm mb-8" id="subtitle">You must subscribe to our channel to get the video link.</p>

            <!-- Timer Circle -->
            <div class="relative w-32 h-32 mx-auto mb-8">
                <svg class="w-full h-full progress-ring" viewBox="0 0 100 100">
                    <circle class="text-gray-700" stroke-width="8" stroke="currentColor" fill="transparent" r="40" cx="50" cy="50" />
                    <circle id="progressBar" class="text-red-500 transition-all duration-1000 ease-linear" stroke-width="8" stroke="currentColor" fill="transparent" r="40" cx="50" cy="50" stroke-dasharray="251.2" stroke-dashoffset="0" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span id="timerText" class="text-3xl font-bold text-white">10</span>
                    <span class="text-xs text-gray-400">Seconds</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div id="actionBox">
                <button onclick="goToYouTube()" id="subBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg mb-3 transition shadow-lg shadow-red-500/30">
                    <i class="fab fa-youtube mr-2"></i> Subscribe Now
                </button>
                <p class="text-xs text-gray-500">After subscribing, wait for the timer to end.</p>
            </div>

            <!-- Unlocked Video Box -->
            <div id="videoBox" class="hidden">
                <div class="bg-green-500/20 border border-green-500/50 p-4 rounded-lg mb-4">
                    <i class="fas fa-check-circle text-green-500 text-2xl mb-2"></i>
                    <p class="text-green-400 font-bold">Verified & Unlocked!</p>
                </div>
                <a href="#" id="finalVideoLink" target="_blank" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                    <i class="fas fa-play mr-2"></i> Watch Video Now
                </a>
            </div>
        </div>
    </div>

    <script>
        const adminView = document.getElementById('adminView');
        const userView = document.getElementById('userView');
        const adminBar = document.getElementById('adminBar');
        
        let ytLink = "";
        let videoLink = "";
        let currentMagicUrl = "";
        let timerInterval = null;

        // Check if URL has data (User opened a generated link)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                try {
                    const data = JSON.parse(atob(encodedData));
                    ytLink = data.yt;
                    videoLink = data.vid;
                    
                    // Show user view, hide admin
                    adminView.classList.add('hidden-view');
                    userView.classList.remove('hidden-view');
                    userView.classList.add('flex');
                    adminBar.classList.add('hidden'); // Hide admin copy bar
                    
                    startUserTimer();
                } catch(e) {
                    console.error("Invalid link data");
                }
            }
        }

        function generateLink() {
            const yt = document.getElementById('ytLink').value.trim();
            const vid = document.getElementById('videoLink').value.trim();

            if(!yt || !vid) return alert("Please fill both links!");

            // Add sub_confirmation=1 to YT link
            let subLink = yt;
            if(subLink.includes('?')) subLink += '&sub_confirmation=1';
            else subLink += '?sub_confirmation=1';

            ytLink = subLink;
            videoLink = vid;

            // Encode for URL
            const data = { yt: subLink, vid: videoLink };
            const encoded = btoa(JSON.stringify(data));
            
            // Generate URL
            currentMagicUrl = window.location.origin + window.location.pathname + '?data=' + encoded;

            // Switch to User View
            adminView.classList.add('hidden-view');
            userView.classList.remove('hidden-view');
            userView.classList.add('flex');
            
            // Show Admin Top Bar
            adminBar.classList.remove('hidden');
            document.getElementById('shareLinkText').innerText = currentMagicUrl;

            // Update History so refresh doesn't lose data
            history.pushState({}, '', currentMagicUrl);

            startUserTimer();
        }

        function copyLink() {
            navigator.clipboard.writeText(currentMagicUrl);
            alert("Link Copied! Send this to users.");
        }

        function resetAdmin() {
            // Go back to Admin View
            window.location.href = window.location.pathname;
        }

        function goToYouTube() {
            window.open(ytLink, '_blank');
            
            const btn = document.getElementById('subBtn');
            btn.innerHTML = `<i class="fas fa-check mr-2"></i> Subscribed`;
            btn.classList.replace('bg-red-600', 'bg-gray-600');
            btn.disabled = true;
        }

        // --- TIMER LOGIC ---
        let timeLeft = 10;
        const totalTime = 10;
        const timerText = document.getElementById('timerText');
        const progressBar = document.getElementById('progressBar');
        const circumference = 2 * Math.PI * 40;

        function startUserTimer() {
            // Reset Timer
            timeLeft = 10;
            timerText.innerText = timeLeft;
            progressBar.style.strokeDashoffset = 0;
            document.getElementById('title').innerText = "Subscribe to Unlock";
            document.getElementById('subtitle').innerText = "You must subscribe to our channel to get the video link.";
            document.getElementById('actionBox').classList.remove('hidden');
            document.getElementById('videoBox').classList.add('hidden');

            if(timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                
                const offset = circumference - (timeLeft / totalTime) * circumference;
                progressBar.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    unlockVideo();
                }
            }, 1000);
        }

        function unlockVideo() {
            document.getElementById('title').innerText = "Video Unlocked!";
            document.getElementById('subtitle').innerText = "Click below to watch the video.";
            document.getElementById('actionBox').classList.add('hidden');
            document.getElementById('videoBox').classList.remove('hidden');
            document.getElementById('finalVideoLink').href = videoLink;
            
            if(navigator.vibrate) navigator.vibrate(200);
        }
    </script>
</body>
  </html>
