<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRYS Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://download-apks-adc2c-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
    </script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
        .panel { border: 1px solid #00ff41; box-shadow: 0 0 10px #00ff41; background: #0a0a0a; }
        input, select { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 8px; }
        button { background: #00ff41; color: #000; font-weight: bold; padding: 10px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #00ff41; }
    </style>
</head>
<body class="min-h-screen p-5">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl text-center mb-8 border-b border-[#00ff41] pb-4">XRYS CONTROL CENTER</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Standard Key Generator -->
            <div class="panel p-5">
                <h2 class="text-xl mb-4">Generate Standard Key (1 Day Limit)</h2>
                <div class="flex flex-col gap-3">
                    <select id="stdDuration">
                        <option value="3600000">1 Hour</option>
                        <option value="10800000">3 Hours</option>
                        <option value="21600000">6 Hours</option>
                        <option value="28800000">8 Hours</option>
                        <option value="43200000">12 Hours</option>
                        <option value="86400000">24 Hours</option>
                        <option value="604800000">7 Days</option>
                        <option value="1296000000">15 Days</option>
                        <option value="2592000000">30 Days</option>
                    </select>
                    <button onclick="genStandardKey()">Generate Key</button>
                </div>
                <div id="stdResult" class="mt-4 text-sm break-all"></div>
            </div>

            <!-- Universal Key Generator -->
            <div class="panel p-5">
                <h2 class="text-xl mb-4">Generate Universal Key</h2>
                <div class="flex flex-col gap-3">
                    <select id="uniDuration">
                        <option value="10800000">3 Hours</option>
                        <option value="25200000">7 Hours</option>
                        <option value="86400000">1 Day</option>
                        <option value="259200000">3 Days</option>
                    </select>
                    <select id="uniUsers">
                        <option value="50">50 Users</option>
                        <option value="100">100 Users</option>
                        <option value="250">250 Users</option>
                        <option value="500">500 Users</option>
                        <option value="1000">1000 Users</option>
                        <option value="1500">1500 Users</option>
                    </select>
                    <button onclick="genUniversalKey()">Generate Universal Key</button>
                </div>
                <div id="uniResult" class="mt-4 text-sm break-all"></div>
            </div>

            <!-- Script Generator -->
            <div class="panel p-5 md:col-span-2">
                <h2 class="text-xl mb-4">Generate Fake Script</h2>
                <div class="flex gap-4">
                    <select id="scriptDuration" class="w-1/3">
                        <option value="3600000">1 Hour</option>
                        <option value="86400000">1 Day</option>
                        <option value="604800000">7 Days</option>
                    </select>
                    <button onclick="genScript()" class="w-2/3">Generate Script</button>
                </div>
                <div id="scriptResult" class="mt-4 text-sm max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        
        function randStr(len) {
            let res = '';
            for (let i = 0; i < len; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            return res;
        }

        function getFormattedDate(offsetMs) {
            return Date.now() + parseInt(offsetMs);
        }

        async function genStandardKey() {
            const dur = document.getElementById('stdDuration').value;
            const key = `XRYS-PORXT-${randStr(6)}`;
            const expiry = getFormattedDate(dur);
            const today = new Date().toISOString().split('T')[0];

            // Save to Firebase
            await window.dbSet(window.dbRef(window.db, 'keys/' + key), {
                created: Date.now(),
                duration: dur,
                expiresAt: expiry,
                dailyLimit: true,
                dateCreated: today,
                used: false,
                type: 'standard'
            });

            document.getElementById('stdResult').innerHTML = `Generated: <b>${key}</b><br>Expires in: ${dur / 3600000} hours`;
        }

        async function genUniversalKey() {
            const dur = document.getElementById('uniDuration').value;
            const maxU = document.getElementById('uniUsers').value;
            
            let durCode = "3HR";
            if(dur == "25200000") durCode = "7HR";
            if(dur == "86400000") durCode = "1DY";
            if(dur == "259200000") durCode = "3DY";

            const key = `XRYS-PORXT-${randStr(6)}-TRIAL-${durCode}`;
            const expiry = getFormattedDate(dur);

            await window.dbSet(window.dbRef(window.db, 'keys/' + key), {
                created: Date.now(),
                duration: dur,
                expiresAt: expiry,
                maxUsers: maxU,
                currentUsers: 0,
                used: false,
                type: 'universal'
            });

            document.getElementById('uniResult').innerHTML = `Generated: <b>${key}</b><br>Max Users: ${maxU}`;
        }

        async function genScript() {
            const dur = document.getElementById('scriptDuration').value;
            const scriptId = `XRYS-SCRPT-${randStr(6)}`;
            const expiry = getFormattedDate(dur);
            
            // Generate 1000 lines of fake hack code
            let fakeCode = `[XRYS ANTI-BAN SCRIPT - SECURE]\n[LOADING MEMORY...]\n`;
            const hex = "0123456789ABCDEF";
            const cmds = ["HOOK", "PATCH", "WRITE", "READ", "INJECT", "SCAN"];
            
            for(let i=0; i<1000; i++) {
                let addr = "0x" + randStr(8) + hex[Math.floor(Math.random()*16)];
                let cmd = cmds[Math.floor(Math.random() * cmds.length)];
                fakeCode += `${cmd} | ADDR: ${addr} | STATUS: SUCCESS\n`;
            }
            
            await window.dbSet(window.dbRef(window.db, 'scripts/' + scriptId), {
                code: fakeCode,
                duration: dur,
                expiresAt: expiry,
                used: false
            });

            document.getElementById('scriptResult').innerHTML = `Script Generated: <b>${scriptId}</b><br><textarea class="w-full h-24 bg-black text-green-500 mt-2 p-2 border border-green-500">${fakeCode.substring(0, 300)}...</textarea>`;
        }
    </script>
</body>
</html>
